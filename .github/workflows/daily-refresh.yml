name: Daily recall refresh
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Government of Canada recall data
        run: curl -LfsS https://recalls-rappels.canada.ca/sites/default/files/opendata-donneesouvertes/HCRSAMOpenData.json -o /tmp/recalls.json
      - name: Rebuild static index
        run: python3 scripts/build.py
      - name: Commit changed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html recall category retailer topic robots.txt sitemap.xml
          git diff --cached --quiet || git commit -m "Daily recall data refresh"
          git push
